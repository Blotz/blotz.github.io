baseURL = 'https://www.ftheil.com/'
languageCode = 'en-us'
title = 'Blog???'
copyright = "[MIT Ferdinand Theil.](/LICENSE)"
theme = 'typo'


[params]
# Meta description
description = "A website for me to post about random stuff"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# intro
homeIntroTitle = 'Hi!'
homeIntroContent = """
Not really sure what to introduce here.
I just sorta post whatever? 
Really I made this website to improve my chances of getting a job.
"""

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 10
listSummaries = false
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

[[params.social]]
name = "github"
url = "https://github.com/blotz"
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/ferdinand-theil-197550245/"
[[params.social]]
name = "email"
url = "ferdinand@ftheil.com"  # no need for "mailto:" in the head

# Main menu pages
[[params.menu]]
name = "Home"
url = "/"
[[params.menu]]
name = "About"
url = "/about"
[[params.menu]]
name = "Blog"
url = "/posts"
[[params.menu]]
name = "Photos"
url = "/photos"
[[params.menu]]
name = "Tags"
url = "/tags"
[[params.menu]]
name = "Recipe Searcher"
url = "/recipe"
[[params.menu]]
name = "CTF"
url = "/ctf"


# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'emacs'

# Github pages thing
[caches]
  [caches.images]
    dir = ':cacheDir/images'
